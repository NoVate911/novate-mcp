# Код НЕ собирается на сервере — используются готовые образы из GHCR,
# которые собирает GitHub Actions. Обновление: docker compose pull && docker compose up -d
# Один GHCR-пакет (novate-mcp), три тега: mcp-latest, dashboard-latest, backup-latest.
services:
  mcp:
    image: ghcr.io/novate911/novate-mcp:mcp-latest
    container_name: fastmcp-server
    restart: unless-stopped
    env_file: .env
    volumes:
      # MCP видит ТОЛЬКО папку PROJECTS_DIR из .env — больше ничего на сервере
      - ${PROJECTS_DIR:-./projects}:/data
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
      # Переопределения настроек из панели (только чтение)
      - ./dashboard-data:/config:ro
    networks:
      - web

  dashboard:
    image: ghcr.io/novate911/novate-mcp:dashboard-latest
    container_name: mcp-dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      # Панель работает с проектами в режиме только-чтение
      - ${PROJECTS_DIR:-./projects}:/data:ro
      # Свои настройки (overrides.json) панель может писать
      - ./dashboard-data:/config
      # Архивы бэкапов: чтение + запись только для проверенных загрузок из панели
      - ./backups:/backups
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web

  backup:
    image: ghcr.io/novate911/novate-mcp:backup-latest
    container_name: novate-backup
    restart: unless-stopped
    env_file: .env
    volumes:
      # Проекты: чтение — для бэкапа, запись — для восстановления из архива
      - ${PROJECTS_DIR:-./projects}:/data
      # Настройки панели (overrides.json) + файл-триггер «бэкап сейчас»
      - ./dashboard-data:/config:ro
      # Сюда сервис пишет архивы и last-backup.json
      - ./backups:/backups
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен для Caddyfile берётся из .env
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${PROJECTS_DIR:-./projects}:/srv/projects:ro
    networks:
      - web
    depends_on:
      - mcp
      - dashboard

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
