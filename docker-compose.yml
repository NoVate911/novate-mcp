# Код НЕ собирается на сервере — используются готовые образы из GHCR,
# которые собирает GitHub Actions. Обновление: docker compose pull && docker compose up -d
# Один GHCR-пакет (novate-mcp), теги latest и версионные теги вида mcp-26.8.1.001.
services:
  mcp:
    image: ghcr.io/novate911/novate-mcp:mcp-${NOVATE_VERSION:-latest}
    container_name: fastmcp-server
    restart: unless-stopped
    env_file: .env
    volumes:
      # /data всегда обычная POSIX FS (host bind), никогда не S3/FUSE mount.
      # При S3_ENABLED=true MCP использует её как рабочую копию и синхронизирует через API.
      - ${PROJECTS_DIR:-./projects}:/data
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
      # Переопределения настроек и безопасные команды S3 из панели (только чтение)
      - ./dashboard-data:/config:ro
      # Постоянный S3 outbox/manifest/status; не публикуется через Caddy
      - storage_state:/storage-state
    networks:
      - web

  dashboard:
    image: ghcr.io/novate911/novate-mcp:dashboard-${NOVATE_VERSION:-latest}
    container_name: mcp-dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      # Панель работает с проектами в режиме только-чтение
      - ${PROJECTS_DIR:-./projects}:/data:ro
      # Свои настройки (overrides.json) панель может писать
      - ./dashboard-data:/config
      # Архивы бэкапов: чтение + запись только для проверенных загрузок из панели
      - ./backups:/backups
      # Панель видит только безопасный status.json, не credentials
      - storage_state:/storage-state:ro
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web

  backup:
    image: ghcr.io/novate911/novate-mcp:backup-${NOVATE_VERSION:-latest}
    container_name: novate-backup
    restart: unless-stopped
    env_file: .env
    volumes:
      # Проекты: чтение — для бэкапа, запись — для восстановления из архива
      - ${PROJECTS_DIR:-./projects}:/data
      # Настройки панели (overrides.json) + файл-триггер «бэкап сейчас»
      - ./dashboard-data:/config:ro
      # Сюда сервис пишет архивы и last-backup.json
      - ./backups:/backups
      # Время внутри контейнера = как на хосте
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен для Caddyfile берётся из .env
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${PROJECTS_DIR:-./projects}:/srv/projects:ro
    networks:
      - web
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - mcp
      - dashboard

volumes:
  storage_state:
  caddy_data:
  caddy_config:

networks:
  web:
