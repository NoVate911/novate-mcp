# Код НЕ собирается на сервере — используется готовый образ из GHCR,
# который собирает GitHub Actions. Обновление: docker compose pull && docker compose up -d
services:
  mcp:
    image: ghcr.io/novate911/novate-mcp:latest
    container_name: fastmcp-server
    restart: unless-stopped
    env_file: .env
    command: ["python", "server.py"]
    volumes:
      # MCP видит ТОЛЬКО папку PROJECTS_DIR из .env — больше ничего на сервере
      - ${PROJECTS_DIR:-./projects}:/data
    networks:
      - web

  dashboard:
    image: ghcr.io/novate911/novate-mcp:latest
    container_name: mcp-dashboard
    restart: unless-stopped
    env_file: .env
    command: ["python", "dashboard.py"]
    volumes:
      # Панель работает в режиме только-чтение: смотреть и скачивать можно,
      # изменять файлы может только MCP
      - ${PROJECTS_DIR:-./projects}:/data:ro
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен для Caddyfile берётся из .env
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${PROJECTS_DIR:-./projects}:/srv/projects:ro
    networks:
      - web
    depends_on:
      - mcp
      - dashboard

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
