name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install fastmcp
      - name: Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Static checks
        run: |
          python -m py_compile src/server.py src/settings.py src/storage.py src/backup.py
          bash -n install.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: mcp, tag: mcp-latest }
          - { target: dashboard, tag: dashboard-latest }
          - { target: backup, tag: backup-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/novate911/novate-mcp:${{ matrix.tag }}
